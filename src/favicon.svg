<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#080331"/>
  <!-- Quadrant axes -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#2a1668" stroke-width="0.75"/>
  <line x1="16" y1="2" x2="16" y2="30" stroke="#2a1668" stroke-width="0.75"/>
  <!-- Rings: hold → assess → trial → adopt (outer to inner) -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#707080" stroke-width="1.25" opacity="0.7"/>
  <circle cx="16" cy="16" r="9.5"  fill="none" stroke="#dd23bb" stroke-width="1.25" opacity="0.8"/>
  <circle cx="16" cy="16" r="6"    fill="none" stroke="#2d62ff" stroke-width="1.25" opacity="0.9"/>
  <circle cx="16" cy="16" r="2.75" fill="none" stroke="#ddf849" stroke-width="1.25"/>
  <!-- Blips -->
  <circle cx="21" cy="10" r="1.6" fill="#ddf849"/>
  <circle cx="10" cy="21" r="1.6" fill="#2d62ff"/>
  <circle cx="22" cy="21" r="1.6" fill="#dd23bb"/>
  <circle cx="9"  cy="11" r="1.6" fill="#707080"/>
</svg>
